<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contrata — sistema de gestão de contratos, fornecedores e anexos.">
  <title>Contrata · Gestão de Contratos</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="boot-pending">
  <div class="boot-screen" id="boot-screen">
    <div class="brand-symbol brand-symbol-lg">C</div>
    <div class="spinner spinner-dark" aria-hidden="true"></div>
    <p>Carregando seu ambiente de contratos…</p>
  </div>

  <div class="app-shell" id="app-shell" hidden>
    <div class="sidebar-scrim" id="sidebar-scrim"></div>

    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/painel" aria-label="Contrata — início">
        <span class="brand-symbol">C</span>
        <span class="brand-text">
          <strong>Contrata</strong>
          <small>Gestão de contratos</small>
        </span>
      </a>

      <div class="nav-label">Navegação</div>
      <nav class="main-nav" aria-label="Menu principal">
        <a href="#/painel" class="nav-link" data-route="painel">
          <span class="nav-icon" data-icon="dashboard"></span>
          <span>Painel</span>
        </a>
        <a href="#/contratos" class="nav-link" data-route="contratos">
          <span class="nav-icon" data-icon="contracts"></span>
          <span>Contratos</span>
          <span class="nav-count" id="nav-contracts-count">0</span>
        </a>
        <a href="#/arquivos" class="nav-link" data-route="arquivos">
          <span class="nav-icon" data-icon="folder"></span>
          <span>Arquivos</span>
          <span class="nav-count" id="nav-files-count">0</span>
        </a>
        <a href="#/exportar" class="nav-link" data-route="exportar">
          <span class="nav-icon" data-icon="download"></span>
          <span>Exportar</span>
        </a>
      </nav>

      <div class="sidebar-spacer"></div>

      <div class="sidebar-note">
        <span class="status-dot"></span>
        <span>Modo local · JSON</span>
      </div>

      <div class="sidebar-user">
        <span class="avatar" id="user-avatar">AD</span>
        <div class="sidebar-user-info">
          <strong id="user-name">Administrador</strong>
          <small id="user-role">Administrador</small>
        </div>
        <button type="button" class="icon-btn icon-btn-inverse" id="btn-logout" title="Sair" aria-label="Sair">
          <span data-icon="logout"></span>
        </button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button type="button" class="icon-btn mobile-menu-btn" id="btn-menu" aria-label="Abrir menu">
          <span data-icon="menu"></span>
        </button>
        <div class="page-heading">
          <span class="eyebrow" id="page-eyebrow">Visão geral</span>
          <h1 id="page-title">Painel</h1>
        </div>
        <div class="topbar-right">
          <span class="current-date" id="current-date"></span>
          <button type="button" class="btn btn-secondary btn-sm quick-export" id="btn-quick-export">
            <span data-icon="download"></span>
            <span>Exportar</span>
          </button>
        </div>
      </header>

      <main id="view" class="view-container" tabindex="-1"></main>
    </div>
  </div>

  <div id="toast-stack" class="toast-stack" aria-live="polite"></div>
  <div id="modal-root"></div>

  <button type="button" class="chat-bubble" id="btn-chat-bubble" aria-label="Abrir assistente virtual" title="Assistente virtual">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
    <span class="badge" id="chat-badge" hidden>!</span>
    <span class="visually-hidden">Assistente virtual</span>
  </button>

  <script type="module" src="js/app.js"></script>
</body>
</html>
